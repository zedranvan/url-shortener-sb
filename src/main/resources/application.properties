spring.application.name=usl-shortener-sb

# 本地端口：8080 已被 mall-pro 占用，这里用 8081
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/url_shortener_db}
spring.datasource.username=${DB_USERNAME:shortener}
spring.datasource.password=${DB_PASSWORD:shortener_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true


spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION


# SQL 日志：开发时可调为 DEBUG / TRACE，压测与演示前建议保持 INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO


jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Frontend URL for CORS
frontend.url=${FRONTEND_URL:http://localhost:5173}

#redis ??
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=redis_password

